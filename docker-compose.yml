# Local helpers only — Postgres lives in your existing `postgres-18` container (host :5433).
# Redis: use host Redis on :6379 (already running).
# Media: Cloudflare R2 (no MinIO).

services:
  lookit-api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on: []
    container_name: lookit-api
    ports:
      - '3007:3007'
    env_file:
      - ./.env
    volumes:
      - ./files:/app/files
      - ./logs:/app/logs
      - ./tmp:/app/tmp
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    command: sh -c "npx dbmate up && npm run start:api"

  lookit-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lookit-worker
    env_file:
      - ./.env
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    command: sh -c "npm run start:worker"
    profiles:
      - full
