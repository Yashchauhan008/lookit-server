# Local helpers only — Postgres lives in your existing `postgres-18` container (host :5433).
# Redis: use host Redis on :6379 (already running) OR uncomment redis below.

services:
  # Optional local MinIO stand-in for R2 (enable when uploads land)
  # minio:
  #   image: minio/minio:latest
  #   command: server /data --console-address ":9001"
  #   ports:
  #     - '9000:9000'
  #     - '9001:9001'
  #   environment:
  #     MINIO_ROOT_USER: lookit
  #     MINIO_ROOT_PASSWORD: lookitsecret
  #   volumes:
  #     - minio_data:/data

  lookit-api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on: []
    container_name: lookit-api
    ports:
      - '3007:3007'
    env_file:
      - ./.env
    volumes:
      - ./files:/app/files
      - ./logs:/app/logs
      - ./tmp:/app/tmp
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    command: sh -c "npx dbmate up && npm run start:api"

