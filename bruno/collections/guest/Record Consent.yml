info:
  name: Record Consent
  type: http
  seq: 3

http:
  method: POST
  url: "{{host}}/e/{{event_slug}}/consent"
  headers:
    - name: Authorization
      value: "Bearer {{guest_token}}"
  body:
    type: json
    data: |-
      {
        "accepted": true
      }
  auth: inherit

settings:
  encodeUrl: true
